<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/brand/icon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Nexus Card Co</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111021;
    color: #e8e6f5;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(ellipse at 50% 30%, rgba(124,109,225,.16), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(88,101,242,.10), transparent 55%);
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .lede { font-size: 14px; line-height: 1.65; color: #b9b4d4; margin-bottom: 28px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    background: #5865F2; color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600;
    padding: 13px 26px; border-radius: 10px;
    transition: background .15s ease;
  }
  .btn:hover { background: #4752d4; }
  .btn-outline {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    background: transparent; color: #cfc9ea; text-decoration: none;
    font-size: 15px; font-weight: 600;
    padding: 12px 25px; border-radius: 10px; border: 1px solid #3a3560;
    transition: border-color .15s ease, color .15s ease;
    margin-top: 12px;
  }
  .btn-outline:hover { border-color: #7c6de1; color: #fff; }
  .card {
    background: rgba(255,255,255,.035); border: 1px solid #2c2750;
    border-radius: 14px; padding: 22px; margin-bottom: 22px; text-align: left;
  }
  .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card p { font-size: 13px; line-height: 1.6; color: #b9b4d4; margin-bottom: 14px; }
  input[type=email] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #3a3560; background: #17162b; color: #e8e6f5;
    font-size: 15px; margin-bottom: 10px;
  }
  input[type=email]:focus { outline: none; border-color: #7c6de1; }
  button.primary {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: #7c6de1; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: #6a59d4; }
  button.primary:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 13px; line-height: 1.6; margin-top: 12px; }
  .msg.ok { color: #7fd6a6; }
  .msg.err { color: #f0928f; }
  .divider {
    font-size: 12px; color: #6f6a92; margin: 22px 0 18px;
    text-transform: uppercase; letter-spacing: .08em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Sign in</div>
    <p class="lede">
      A membership gets you the Grading Calculator and Card Catalog in full &mdash;
      no Discord account needed.
    </p>

    <div class="card">
      <h2>Sign in with your email</h2>
      <p>We'll email you a link that signs you in. No password to remember.</p>
      <form id="link-form" autocomplete="on">
        <input type="email" id="email" name="email" required
               placeholder="you@example.com" autocomplete="email">
        <button type="submit" class="primary" id="send">Email me a sign-in link</button>
      </form>
      <div class="msg" id="msg" role="status" aria-live="polite">
        {% if error %}<span class="err">{{ error }}</span>{% endif %}
      </div>
    </div>

    <div class="divider">or</div>
    <a class="btn" href="/login">Sign in with Discord</a>
    <br>
    <a class="btn-outline" href="/guest">Continue as a guest instead</a>
  </div>

  <script src="/static/csrf.js"></script>
  <script>
    const form = document.getElementById("link-form");
    const btn = document.getElementById("send");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      btn.disabled = true;
      btn.textContent = "Sending…";
      msg.innerHTML = "";
      try {
        const resp = await fetch("/api/account/login-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          msg.innerHTML = '<span class="ok">' + (data.detail || "Check your email.") + '</span>';
          btn.textContent = "Link sent";
          return;
        }
        msg.innerHTML = '<span class="err">' +
          (data.detail || "Something went wrong. Try again in a moment.") + '</span>';
      } catch (err) {
        msg.innerHTML = '<span class="err">Couldn\'t reach the server. Check your connection.</span>';
      }
      btn.disabled = false;
      btn.textContent = "Email me a sign-in link";
    });
  </script>
</body>
</html>
